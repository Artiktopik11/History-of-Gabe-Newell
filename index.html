<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <title>Gaben Legacy</title>
  <style>
    body { margin: 0; padding: 0; background: #0a0a0a; color: #fff; font-family: 'Courier New', monospace; overflow: hidden; }
    #intro { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #111; display: flex; justify-content: center; align-items: center; z-index: 9999; }
    .intro-box { text-align: center; max-width: 500px; width: 90%; }
    .intro-title { font-size: 3rem; color: #ff4d4d; text-transform: uppercase; letter-spacing: 4px; margin-bottom: 15px; }
    .anim-stage { position: relative; width: 200px; height: 200px; margin: 30px auto; opacity: 0; transform: translateY(20px); }
    .anim-stage.visible { opacity: 1; transform: translateY(0); transition: opacity 0.5s ease, transform 0.5s ease; }

    /* SVG-монтировка — твой собственный контент */
    .crowbar-svg { width: 100%; height: 100%; display: block; }

    .caption { display: block; margin-top: 10px; color: #aaa; font-size: 0.9rem; }
    .btn { padding: 12px 24px; background: #333; color: #fff; border: 1px solid #666; cursor: pointer; font-family: inherit; text-transform: uppercase; letter-spacing: 2px; display: none; }
    .btn:hover { background: #555; }
  </style>
</head>
<body>
  <div id="intro">
    <div class="intro-box">
      <h1 class="intro-title">GABEN LEGACY</h1>

      <!-- Анимация 1: силуэт (заменить src на свой файл) -->
      <div id="anim1" class="anim-stage">
        <img src="cs-silhouette.png" alt="CS 1.6 silhouette" style="width:100%;height:100%;object-fit:contain;" />
        <span class="caption">CS 1.6: классика навсегда</span>
      </div>

      <!-- Анимация 2: SVG-монтировка (полностью твой код) -->
      <div id="anim2" class="anim-stage">
        <svg class="crowbar-svg" viewBox="0 0 100 100" aria-label="Монтировка">
          <path d="M 15 85 Q 20 75 30 50 T 50 20 T 70 50 T 80 75 Q 85 85 90 85" stroke="#444" fill="none" stroke-width="6" stroke-linecap="round"/>
          <path d="M 45 40 L 55 40 L 60 25 L 40 25 Z" fill="#666" stroke="#222" stroke-width="1"/>
        </svg>
        <span class="caption">Инструмент легенды</span>
      </div>

      <button id="startBtn" class="btn">Продолжить</button>
    </div>
  </div>

  <main id="content" style="display:none; padding: 40px;">
    <h1>История Гейба Ньюэлла</h1>
    <p>Здесь будет вся история: Microsoft, Valve, Half‑Life, Steam…</p>
  </main>

  <script>
    const duration = 2500; // 2.5 секунды на каждую анимацию
    const stages = [document.getElementById('anim1'), document.getElementById('anim2')];
    const btn = document.getElementById('startBtn');

    function showStage(index) {
      if (index >= stages.length) {
        btn.style.display = 'block';
        return;
      }
      stages[index].classList.add('visible');
      setTimeout(() => showStage(index + 1), duration);
    }

    showStage(0);

    btn.addEventListener('click', () => {
      document.getElementById('intro').style.display = 'none';
      document.getElementById('content').style.display = 'block';
      document.body.style.overflow = 'auto';
    });
  </script>
</body>
</html>
